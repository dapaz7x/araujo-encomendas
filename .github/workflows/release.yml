name: Publicar versão do Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar aplicativo
        run: pnpm desktop:build

      - name: Gerar instaladores
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Anexar instaladores à versão
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-final/*.exe
